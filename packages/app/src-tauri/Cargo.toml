[package]
name = "boorubox"
version = "0.1.0"
description = "Local image library and staging area in front of boorus"
authors = ["Hana Shiro"]
edition = "2024"

[lib]
# Distinct from the bin name so the two never collide on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "boorubox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
