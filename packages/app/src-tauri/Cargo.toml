[package]
name = "boorubox"
version = "26.9.2501"
description = "Local image library and staging area in front of boorus"
authors = ["Hana Shiro"]
edition = "2024"

[lib]
# Distinct from the bin name so the two never collide on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "boorubox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what serves library images to the webview through
# `convertFileSrc` (design D7). It is paired with `app.security.assetProtocol`
# in `tauri.conf.json`: tauri-build compares the two and fails the build when
# only one of them is set, so they are changed together or not at all.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `bundled` compiles SQLite in (FTS5 included) so no system library decides
# whether the search index can be created; `functions` is the x_account()
# scalar the query compiler registers.
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
image = "0.25"
axum = { version = "0.8", features = ["multipart"] }
# `sync` is the oneshot channel `pick_library` waits on while the folder
# dialog runs on the thread that owns the UI.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
tower = "0.5"
# `time` turns `zip::DateTime::try_from(time::PrimitiveDateTime)` on, so an
# export entry's mtime can be the image's `captured_at` (selection-and-bulk,
# "Export" human update) instead of the crate's 1980-01-01 default; `time`
# itself is already in the tree (pulled in transitively, e.g. by `chrono`),
# so this names a feature rather than adding a new dependency.
zip = { version = "8", default-features = false, features = ["time"] }
time = { version = "0.3", default-features = false }
# The auto-tag rules' regular-expression engine (`auto-tag-rules` design D6).
regex = "1"
# The OS credential store the booru API key lives in (`booru-sites` design
# D7), never `settings.json` or the library file. Only the two target
# platforms' native backends (§6 is macOS + Windows): no Linux backend, so a
# CI box with no keychain fails loudly if it ever reaches the real store
# rather than silently degrading — no test should, since `Credentials` is a
# trait for exactly this reason (`booru-upload` design D7).
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native"] }
# The booru HTTP client (`booru-upload` design D4). `default-tls` is platform
# TLS (native-tls), deliberately not `rustls` + bundled roots: a self-hosted
# instance's certificate is one the machine has already been told to trust,
# and bundled roots would reject it with no way to fix it from inside the app.
reqwest = { version = "0.12", features = ["multipart", "json", "default-tls"] }
# Danbooru keys posts by the file's MD5; the upload asks for it before sending
# the file, because a duplicate is otherwise merged into the original post
# rather than refused (`booru-upload` design D12).
md-5 = "0.10"

# `tauri-plugin-updater` and `tauri-plugin-process` are unavailable on mobile
# (`app-update` design D1); guarded per the plugins' own install docs so a
# mobile build never tries to resolve either crate.
[target."cfg(not(any(target_os = \"android\", target_os = \"ios\")))".dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[dev-dependencies]
http-body-util = "0.1"
# The mock runtime the command tests drive: a headless `AppHandle` is the only
# way to call a command that takes one without opening a window.
tauri = { version = "2", features = ["test"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
# `util` brings ServiceExt::oneshot, which drives the router in http tests.
tower = { version = "0.5", features = ["util"] }
# The mocked booru the upload client's tests run against (`booru-upload`
# design D14): async-first, and each `MockServer` binds its own random port
# with no global registry, so the poll tests — the slow ones — still run in
# parallel under `cargo test`'s default scheduling.
wiremock = "0.6.5"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
