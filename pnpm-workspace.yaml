packages:
  - packages/*

# Versions every package must agree on live here once; packages reference "catalog:".
catalog:
  typescript: ~6.0.3
  vite: ^8.0.16
  tailwindcss: ^4.3.3

# pnpm 12 refuses to install while a dependency's build script is neither allowed nor
# denied. spawn-sync (via vite-plugin-web-extension -> web-ext-run) ships a legacy
# postinstall shim we do not need.
allowBuilds:
  spawn-sync: false
