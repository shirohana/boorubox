# A Windows installer from any branch, as a run artifact and never a release.
#
# Exists because the owner's Windows machine has no toolchain: a Windows-only
# defect (the title-bar drag focus loop of 2026-09-12 was the first) can only
# be checked on a real Windows build, and a release is the wrong vehicle for
# an unproven fix — a published version is never reused (CLAUDE.md, Releases),
# so every wrong guess would burn one. Run it from the Actions tab or
# `gh workflow run windows-test-build.yml --ref <branch>`, download the
# artifact, install over the current build, check by hand.
#
# The same version as the branch's Cargo.toml, on purpose: the NSIS installer
# reinstalls over an equal version, and the app's updater compares against
# `latest.json` only, so a test build never offers or blocks an update.
name: Windows test build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          rust: 'true'
      - run: pnpm install --frozen-lockfile

      # The signing key is needed even here: with `plugins.updater.pubkey`
      # committed, the bundler refuses to build without the private half
      # (CLAUDE.md, Releases). The `.sig` it produces is not uploaded — nothing
      # reads it outside a release.
      - run: pnpm --filter @boorubox/app tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - uses: actions/upload-artifact@v6.0.0
        with:
          name: boorubox-windows-${{ github.ref_name }}-${{ github.sha }}
          path: |
            packages/app/src-tauri/target/release/bundle/nsis/*-setup.exe
            packages/app/src-tauri/target/release/boorubox.exe
          if-no-files-found: error
          retention-days: 14
